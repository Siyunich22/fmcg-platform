version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: fmcg_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fmcg
      POSTGRES_PASSWORD: fmcg
      POSTGRES_DB: fmcg
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fmcg"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: fmcg_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://fmcg:fmcg@db:5432/fmcg
      SECRET_KEY: change-me-in-production-use-openssl-rand
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
    volumes:
      - ./apps/api:/app
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: fmcg_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: change-me-in-production
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

volumes:
  postgres_data:
  uploads_data:
