services:
  - type: web
    name: fmcg-api
    runtime: python
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false   # вводишь вручную в Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false   # вводишь вручную (URL твоего Vercel)
